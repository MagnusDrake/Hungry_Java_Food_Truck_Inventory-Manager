<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<h1>Inhouse Part Detail</h1>
<form action="#" th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST">

    <input type="hidden" th:field="*{id}"/>

    <p>Name: <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;">Name Error</p>

    <p>Price: <input type="text" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red;">Price Error</p>

    <p>Inventory: <input type="text" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}" style="color:red;">Inventory Error</p>

    <p>Part ID: <input type="text" th:field="*{partId}" placeholder="Part ID" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('partId')}" th:errors="*{partId}" style="color:red;">Part ID Error</p>

    <p>Min: <input type="text" th:field="*{min}" placeholder="Minimum" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('min')}" th:errors="*{min}" style="color:red;">Minimum Error</p>

    <p>Max: <input type="text" th:field="*{max}" placeholder="Maximum" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('max')}" th:errors="*{max}" style="color:red;">Maximum Error</p>

    <p><input type="submit" value="Submit" class="btn btn-primary" /></p>
</form>
<a href="http://localhost:8080/">Link
    to Main Screen</a>
</body>
</html>
