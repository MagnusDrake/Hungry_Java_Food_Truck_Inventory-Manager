<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body class="bg-light">
<div class="container py-2">
    <div class="container-fluid p-4">
    <h1>Food Truck Name?</h1>
    <hr>
        <form th:action="@{/save-name}" th:object="${nameFormData}" method="POST">
            <p>Name: <input type="text" th:field="*{userName}" placeholder="Enter Name" /></p>

            <p><span th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}">Name Error</span></p>

            <p><input type="submit" value="Submit"/></p>
        </form>
    <hr>
    <footer class="footer justify-content-between align-items-center mb-5">
        <span style="justify-self: start" class="text-muted small">© 2026 The Hungry Java Food Truck Technologies.</span>

        <nav>
            <span><a class="text-decoration-none text-secondary fw-bold" th:href="@{/mainscreen}">Home</a></span>
            <span class="text-muted mx-2">|</span>
            <span><a class="text-decoration-none text-secondary fw-bold" th:href="@{/about}">About</a></span>
        </nav>

        <a style="justify-self: end" th:href="@{/settings}" class="btn btn-outline-secondary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill me-1" viewBox="0 0 16 16">
                <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.86z"/>
            </svg>
            Change Store Name
        </a>
    </footer>
    </div>
</div>

</body>
</html>
